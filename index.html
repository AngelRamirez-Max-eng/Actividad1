<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solitario 2048 - UCAB</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="game-header">
        <div class="brand">
            <span class="ucab-tag">Facíl?, pa ti ta facíl</span>
            <h1>Solitario 2048</h1>
        </div>
        <div class="stats-container">
            <div class="score-box">
                <span class="score-label">PUNTOS</span>
                <span id="score" class="score-value">0</span>
            </div>
            <button id="restart-btn" class="btn-restart">Reiniciar</button>
        </div>
    </header>

    <main class="game-layout">
        <!-- Sección del Mazo / Siguiente Carta -->
        <section class="deck-section">
            <h2>Siguiente Carta</h2>
            <div id="next-card-container" class="deck-slot">
                <!-- Se genera dinámicamente con JS -->
            </div>
            <p class="instruction">Haz clic en una columna para colocar la carta.</p>
        </section>

        <!-- Zona de Juego (4 Columnas) -->
        <section class="board-section">
            <div class="game-columns">
                <div class="column-wrapper">
                    <span class="col-indicator">Col 1</span>
                    <div id="col-0" class="column"></div>
                </div>
                <div class="column-wrapper">
                    <span class="col-indicator">Col 2</span>
                    <div id="col-1" class="column"></div>
                </div>
                <div class="column-wrapper">
                    <span class="col-indicator">Col 3</span>
                    <div id="col-2" class="column"></div>
                </div>
                <div class="column-wrapper">
                    <span class="col-indicator">Col 4</span>
                    <div id="col-3" class="column"></div>
                </div>
            </div>
        </section>
    </main>

    <!-- Pantalla de Fin de Juego -->
    <div id="game-over" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h2>¡Fin del Juego!</h2>
            <p>Has alcanzado el límite de cartas permitidas sin posibilidad de fusión.</p>
            <div class="final-score">Puntaje Final: <span id="final-score-value">0</span></div>
            <button id="modal-restart-btn" class="btn-restart large">Jugar de nuevo</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
